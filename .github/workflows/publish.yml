name: Publish to npm

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Semver (or v-prefixed semver) to publish'
                required: true
                type: string
    release:
        types: [published]

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 22
                  registry-url: 'https://registry.npmjs.org'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Sync package version from release tag/input
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  RELEASE_TAG: ${{ github.event.release.tag_name }}
                  INPUT_VERSION: ${{ github.event.inputs.version }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  RAW_VERSION=""

                  if [ "$EVENT_NAME" = "release" ]; then
                    RAW_VERSION="$RELEASE_TAG"
                  elif [ "$EVENT_NAME" = "push" ]; then
                    RAW_VERSION="$REF_NAME"
                  elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    RAW_VERSION="$INPUT_VERSION"
                  fi

                  if [ -z "$RAW_VERSION" ]; then
                    echo "Could not resolve version. Use release tag (vX.Y.Z), tag push, or workflow_dispatch input."
                    exit 1
                  fi

                  CLEAN_VERSION="${RAW_VERSION#v}"

                  if ! [[ "$CLEAN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
                    echo "Invalid release/input version: $RAW_VERSION"
                    exit 1
                  fi

                  CURRENT_VERSION="$(node -p "require('./package.json').version")"

                  if [ "$CURRENT_VERSION" = "$CLEAN_VERSION" ]; then
                    echo "Version already set to $CLEAN_VERSION; skipping npm version bump."
                    exit 0
                  fi

                  npm version "$CLEAN_VERSION" --no-git-tag-version
                  echo "Publishing version: $CLEAN_VERSION"

            - name: Normalize package metadata for provenance/repo match
              shell: bash
              env:
                  GH_REPOSITORY: ${{ github.repository }}
              run: |
                  REPO_URL="https://github.com/${GH_REPOSITORY}"
                  npm pkg set repository.type="git"
                  npm pkg set repository.url="$REPO_URL"
                  npm pkg set homepage="$REPO_URL#readme"
                  npm pkg set bugs.url="$REPO_URL/issues"

            - name: Verify package
              run: npm run check

            - name: Publish to npm (using NPM_TOKEN)
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  npm config set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
                  NPM_CONFIG_PROVENANCE=false npm publish --access public --ignore-scripts
